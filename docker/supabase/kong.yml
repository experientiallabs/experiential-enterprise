_format_version: "2.1"
_transform: true

services:
  - name: rest-v1
    url: http://supabase-rest:3000/
    routes:
      - name: rest-v1-route
        paths:
          - /rest/v1
        strip_path: true
    plugins:
      - name: cors

  - name: auth-v1
    url: http://supabase-auth:9999/
    routes:
      - name: auth-v1-route
        paths:
          - /auth/v1
        strip_path: true
    plugins:
      - name: cors

  - name: storage-v1
    url: http://supabase-storage:5000/
    routes:
      - name: storage-v1-route
        paths:
          - /storage/v1
        strip_path: true
    plugins:
      - name: cors
