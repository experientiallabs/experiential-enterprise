services:
  supabase-db:
    image: ${EXPLABS_STACK_REGISTRY_PREFIX:-}supabase/postgres:15.8.1.060
    restart: unless-stopped
    ports:
      - "${EXPLABS_DB_HOST_PORT:-55422}:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      JWT_SECRET: ${SUPABASE_JWT_SECRET}
      JWT_EXP: 3600
    volumes:
      - supabase-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1 -p 5432"]
      start_period: 30s
      interval: 2s
      timeout: 5s
      retries: 30
    networks: [explabs]

  supabase-migrate:
    image: ${EXPLABS_STACK_REGISTRY_PREFIX:-}supabase/postgres:15.8.1.060
    restart: "no"
    depends_on:
      supabase-db:
        condition: service_healthy
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SUPABASE_DB_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@supabase-db:5432/postgres
      EXPLABS_AUTH_ADMIN_EMAIL: ${EXPLABS_AUTH_ADMIN_EMAIL:-admin@xplabs.ai}
      EXPLABS_AUTH_ADMIN_PASSWORD: ${EXPLABS_AUTH_ADMIN_PASSWORD:-3XP321!}
    volumes:
      - ../supabase:/app/supabase:ro
      - ./supabase:/app/docker/supabase:ro
    entrypoint: ["/bin/bash", "/app/docker/supabase/migrate-and-seed.sh"]
    networks: [explabs]

  supabase-rest:
    image: ${EXPLABS_STACK_REGISTRY_PREFIX:-}postgrest/postgrest:v12.2.12
    restart: unless-stopped
    depends_on:
      supabase-migrate:
        condition: service_completed_successfully
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD:-postgres}@supabase-db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "true"
    networks: [explabs]

  supabase-auth:
    image: ${EXPLABS_STACK_REGISTRY_PREFIX:-}supabase/gotrue:v2.178.0
    restart: unless-stopped
    depends_on:
      supabase-migrate:
        condition: service_completed_successfully
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@supabase-db:5432/postgres?options=-c%20search_path%3Dauth%2Cpublic%2Cextensions
      GOTRUE_DB_NAMESPACE: auth
      DB_NAMESPACE: auth
      API_EXTERNAL_URL: http://localhost:${EXPLABS_SUPABASE_HOST_PORT:-55421}/auth/v1
      GOTRUE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_SITE_URL: http://localhost:${EXPLABS_WEB_HOST_PORT:-3300}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      # The default email login is an emailed 6-digit code (/auth/otp), so the
      # local stack needs a working mailer: sends land in mailpit (UI on
      # EXPLABS_MAILPIT_HOST_PORT), and both template slots email login can
      # fire render the committed code template (served by mail-templates —
      # GoTrue only fetches templates over HTTP). Mirrors the hosted project's
      # dashboard template/SMTP configuration.
      GOTRUE_SMTP_HOST: mailpit
      GOTRUE_SMTP_PORT: 1025
      GOTRUE_SMTP_ADMIN_EMAIL: auth@localhost.local
      GOTRUE_SMTP_SENDER_NAME: Experiential Labs (local)
      GOTRUE_SMTP_MAX_FREQUENCY: 1s
      GOTRUE_MAILER_TEMPLATES_MAGIC_LINK: http://mail-templates:8085/signin-code.html
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: http://mail-templates:8085/signin-code.html
      GOTRUE_MAILER_SUBJECTS_MAGIC_LINK: Your sign-in code
      GOTRUE_MAILER_SUBJECTS_CONFIRMATION: Your sign-in code
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [explabs]

  supabase-auth-seed:
    image: ${EXPLABS_STACK_REGISTRY_PREFIX:-}supabase/postgres:15.8.1.060
    restart: "no"
    depends_on:
      supabase-auth:
        condition: service_healthy
    environment:
      SUPABASE_DB_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@supabase-db:5432/postgres
      EXPLABS_AUTH_ADMIN_EMAIL: ${EXPLABS_AUTH_ADMIN_EMAIL:-admin@xplabs.ai}
      EXPLABS_AUTH_ADMIN_PASSWORD: ${EXPLABS_AUTH_ADMIN_PASSWORD:-3XP321!}
      EXPLABS_DEPLOYMENT_ENVIRONMENT: ${EXPLABS_DEPLOYMENT_ENVIRONMENT:-local}
      EXPLABS_DEMO_SEED_EMAIL: ${EXPLABS_DEMO_SEED_EMAIL:-demo@experientiallabs.ai}
      EXPLABS_DEMO_SEED_PASSWORD: ${EXPLABS_DEMO_SEED_PASSWORD:-DemoShape2026!}
      # Optional real provider keys for the demo org's BYOK connections; absent
      # keys skip the connection (never a fake key).
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - ../supabase:/app/supabase:ro
      - ./supabase:/app/docker/supabase:ro
    entrypoint: ["/bin/bash", "/app/docker/supabase/seed-auth-user.sh"]
    networks: [explabs]

  # Local mail catcher: every GoTrue email (sign-in codes above all) lands
  # here instead of the network. Web UI on the host at
  # EXPLABS_MAILPIT_HOST_PORT; SMTP stays stack-internal. Unprefixed like
  # studio: a local convenience image, not part of the mirrored runtime set.
  mailpit:
    image: axllent/mailpit:v1.20.5
    restart: unless-stopped
    ports:
      - "${EXPLABS_MAILPIT_HOST_PORT:-55424}:8025"
    networks: [explabs]

  # Serves supabase/templates/ to GoTrue (its MAILER_TEMPLATES_* config only
  # accepts URLs), so local emails carry the same body the hosted dashboard
  # templates must be set to.
  mail-templates:
    image: busybox:1.36
    restart: unless-stopped
    command: ["httpd", "-f", "-p", "8085", "-h", "/templates"]
    volumes:
      - ../supabase/templates:/templates:ro
    networks: [explabs]

  supabase-storage:
    image: ${EXPLABS_STACK_REGISTRY_PREFIX:-}supabase/storage-api:v1.19.3
    restart: unless-stopped
    depends_on:
      supabase-rest:
        condition: service_started
    environment:
      ANON_KEY: ${SUPABASE_ANON_KEY}
      SERVICE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      POSTGREST_URL: http://supabase-rest:3000
      PGRST_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@supabase-db:5432/postgres
      FILE_SIZE_LIMIT: "1073741824"
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: explabs-local
      REGION: local
      GLOBAL_S3_BUCKET: explabs-artifacts
      ENABLE_IMAGE_TRANSFORMATION: "false"
    volumes:
      - supabase-storage-data:/var/lib/storage
    networks: [explabs]

  supabase-kong:
    image: ${EXPLABS_STACK_REGISTRY_PREFIX:-}kong:2.8.1
    restart: unless-stopped
    depends_on:
      supabase-rest:
        condition: service_started
      supabase-auth:
        condition: service_healthy
      supabase-storage:
        condition: service_started
    ports:
      - "${EXPLABS_SUPABASE_HOST_PORT:-55421}:8000"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /var/lib/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl
    volumes:
      - ./supabase/kong.yml:/var/lib/kong/kong.yml:ro
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [explabs]

  supabase-studio:
    # Local-only profile on an unpinned tag, so it stays on Docker Hub instead of
    # the EXPLABS_STACK_REGISTRY_PREFIX mirror (mirrors hold pinned tags only).
    image: supabase/studio:latest
    restart: unless-stopped
    profiles: ["studio"]
    depends_on:
      supabase-kong:
        condition: service_healthy
    ports:
      - "${EXPLABS_STUDIO_HOST_PORT:-55423}:3000"
    environment:
      SUPABASE_URL: http://localhost:${EXPLABS_SUPABASE_HOST_PORT:-55421}
      SUPABASE_PUBLIC_URL: http://localhost:${EXPLABS_SUPABASE_HOST_PORT:-55421}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    networks: [explabs]

  api:
    image: ${EXPLABS_API_IMAGE:-explabs-local-api}
    build:
      context: ..
      dockerfile: docker/api/Dockerfile
    restart: unless-stopped
    depends_on:
      supabase-auth-seed:
        condition: service_completed_successfully
      supabase-migrate:
        condition: service_completed_successfully
      supabase-kong:
        condition: service_healthy
      gateway-worker:
        condition: service_healthy
    ports:
      - "${EXPLABS_API_HOST_PORT:-18080}:8080"
    # Same host-side loopback reachability as gateway-worker (Linux runners do
    # not resolve host.docker.internal without it).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Trial distribution: the embedded Experiential engine must stay
      # telemetry-dark like the rest of the stack (README "No phone home").
      # EXP_TELEMETRY=0 wins over any engine settings file.
      EXP_TELEMETRY: "0"
      SUPABASE_URL: http://supabase-kong:8000
      # Signed storage URLs are minted against the internal Kong address; the
      # CLI PUTs/GETs bundles from the host, so rewrite them to the published
      # port before handing them out.
      EXPLABS_PUBLIC_STORAGE_URL: http://127.0.0.1:${EXPLABS_SUPABASE_HOST_PORT:-55421}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_DB_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@supabase-db:5432/postgres
      EXPLABS_STORAGE_BUCKET: explabs-artifacts
      EXPLABS_API_KEY: ${EXPLABS_API_KEY}
      EXPLABS_DEPLOYMENT_ENVIRONMENT: local
      # The public /v1 edge relays every serving request to the private
      # gateway worker at this URL; when it is unset the edge answers 503
      # (no serving backend configured).
      EXPLABS_GATEWAY_WORKER_URL: http://gateway-worker:8080
      EXPLABS_PROJECT_SERVING_DEPLOYMENT_KEY: ${EXPLABS_PROJECT_SERVING_DEPLOYMENT_KEY:?set a distinct internal Project-serving key}
      EXPLABS_RELEASE_FAULT_KEY: ${EXPLABS_RELEASE_FAULT_KEY:-local-release-fault-key}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      FIREWORKS_API_KEY: ${FIREWORKS_API_KEY:-}
      E2B_API_KEY: ${E2B_API_KEY:-}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2).read()",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [explabs]

  gateway-worker:
    # Rides the api image; the EXPLABS_GATEWAY_WORKER_ONLY role launches
    # Experiential's Rust gateway over Postgres and no platform /api surface.
    image: ${EXPLABS_API_IMAGE:-explabs-local-api}
    build:
      context: ..
      dockerfile: docker/api/Dockerfile
    restart: unless-stopped
    depends_on:
      supabase-migrate:
        condition: service_completed_successfully
    # Local benchmark/debug surface only: worker-direct load runs
    # (scripts/ci/gateway_load.sh) separate edge overhead from worker-native
    # latency. Hosted deployments keep the worker cluster-private.
    ports:
      - "${EXPLABS_GATEWAY_WORKER_HOST_PORT:-18081}:8080"
    # The load harness serves its loopback provider on the HOST; host-gateway
    # makes host.docker.internal resolve on Linux too (Docker Desktop already
    # provides it).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Trial distribution: the embedded Experiential engine must stay
      # telemetry-dark like the rest of the stack (README "No phone home").
      # EXP_TELEMETRY=0 wins over any engine settings file.
      EXP_TELEMETRY: "0"
      SUPABASE_DB_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@supabase-db:5432/postgres
      EXPLABS_GATEWAY_WORKER_ONLY: "1"
      EXPLABS_GATEWAY_WORKER_KEY: ${EXPLABS_GATEWAY_WORKER_KEY:?set a distinct internal gateway-worker drain key}
      # Local-stack only: emit Server-Timing so the load smoke's db_n-per-request
      # regression metric is populated. A hosted worker env does not set this,
      # so customers never see internals.
      EXPLABS_GATEWAY_TIMING_HEADER: "1"
      EXPLABS_DEPLOYMENT_ENVIRONMENT: local
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      FIREWORKS_API_KEY: ${FIREWORKS_API_KEY:-}
      # modal is the one host provider whose rows may carry a base_url
      # override, so it is how a local run seeds a host_managed (money-lane)
      # model served by a mock endpoint. The
      # loopback mock accepts any key value, and an EMPTY value would make the
      # catalog builder silently skip the seeded route (the ladder then times
      # out on alias activation), so the local stack defaults to a dummy. No
      # hosted environment uses this compose file, and a local stack has no
      # real Modal rows this credential could reach.
      MODAL_API_KEY: ${MODAL_API_KEY:-local-money-lane-dummy}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=2).read()",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [explabs]

  web:
    image: ${EXPLABS_WEB_IMAGE:-explabs-local-web}
    build:
      context: ..
      dockerfile: docker/web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${EXPLABS_WEB_HOST_PORT:-3300}:3000"
    environment:
      EXPLABS_BACKEND_URL: http://api:8080
      EXPLABS_SERVING_BACKEND_URL: http://api:8080
      # What /api/cli/config advertises to `wmo login`: the CLI runs on the
      # host, so it needs the published API port, not the compose-internal
      # hostname the web server itself uses.
      EXPLABS_PUBLIC_BACKEND_URL: http://127.0.0.1:${EXPLABS_API_HOST_PORT:-18080}
      EXPLABS_API_KEY: ${EXPLABS_API_KEY}
      SUPABASE_URL: http://supabase-kong:8000
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      # Server-only: backs /auth/signup gating and the admin invite APIs.
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      # Azure AI Foundry credentials for the playground's live sample model
      # (/api/playground/chat proxies to GPT-5.5, falling back to Kimi K2.6);
      # unset vars leave the sample unavailable and the picker mock-only.
      AZURE_FOUNDRY_2_ENDPOINT: ${AZURE_FOUNDRY_2_ENDPOINT:-}
      AZURE_FOUNDRY_2_API_KEY: ${AZURE_FOUNDRY_2_API_KEY:-}
      AZURE_FOUNDRY_GPT55_DEPLOYMENT: ${AZURE_FOUNDRY_GPT55_DEPLOYMENT:-}
      AZURE_FOUNDRY_ENDPOINT: ${AZURE_FOUNDRY_ENDPOINT:-}
      AZURE_FOUNDRY_API_KEY: ${AZURE_FOUNDRY_API_KEY:-}
      AZURE_FOUNDRY_KIMI_DEPLOYMENT: ${AZURE_FOUNDRY_KIMI_DEPLOYMENT:-}
    volumes:
      - pnpm-store:/root/.local/share/pnpm/store
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [explabs]

  stack-smoke:
    image: ${EXPLABS_STACK_REGISTRY_PREFIX:-}postgres:15-alpine
    profiles: ["smoke"]
    depends_on:
      supabase-auth:
        condition: service_healthy
      api:
        condition: service_healthy
      gateway-worker:
        condition: service_healthy
      web:
        condition: service_healthy
    environment:
      SUPABASE_DB_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@supabase-db:5432/postgres
      AUTH_URL: http://supabase-auth:9999
      API_URL: http://api:8080
      SERVING_URL: http://api:8080
      GATEWAY_WORKER_URL: http://gateway-worker:8080
      WEB_URL: http://web:3000
      EXPLABS_API_KEY: ${EXPLABS_API_KEY}
      EXPLABS_AUTH_ADMIN_EMAIL: ${EXPLABS_AUTH_ADMIN_EMAIL:-admin@xplabs.ai}
      EXPLABS_AUTH_ADMIN_PASSWORD: ${EXPLABS_AUTH_ADMIN_PASSWORD:-3XP321!}
    volumes:
      - ./tests:/app/docker/tests:ro
      - ./supabase:/app/docker/supabase:ro
    entrypoint: ["/bin/sh", "/app/docker/tests/run-stack-smoke.sh"]
    networks: [explabs]

  gateway-worker-acceptance:
    # Boots against the private gateway worker directly: /health/live and
    # /health/ready, one streamed loopback /v1 chat completion and one
    # /v1/messages Anthropic stream under a real xpl_ key (the loopback
    # OpenAI-compatible provider runs inside this container; the worker's own
    # catalog refresher picks up the seeded model row), exact ledger rows, a
    # uniform 401 on both protocols, and complete row cleanup.
    image: ${EXPLABS_API_IMAGE:-explabs-local-api}
    build:
      context: ..
      dockerfile: docker/api/Dockerfile
    profiles: ["smoke"]
    depends_on:
      gateway-worker:
        condition: service_healthy
    environment:
      # Same engine image as api/gateway-worker, so the same telemetry-dark
      # knob applies (README "No phone home"); the engine default is enabled.
      EXP_TELEMETRY: "0"
      GATEWAY_WORKER_URL: http://gateway-worker:8080
      # The loopback provider binds every interface in this container and
      # advertises the container's own network address so the worker can
      # dispatch back to it (one-off `compose run` containers carry no
      # service alias, so the script resolves its own IP).
      SUPABASE_DB_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@supabase-db:5432/postgres
    volumes:
      - ./tests:/app/docker/tests:ro
    entrypoint:
      ["/app/.venv/bin/python", "/app/docker/tests/gateway_worker_acceptance.py"]
    networks: [explabs]

  insights-suggestions-acceptance:
    # Live-traffic proof for the Insights suggestions pipeline: streams real
    # loopback chat completions (two org-owned aliases shadowing launch-catalog
    # slugs, five requests reporting cached input tokens) through the private
    # gateway worker, then asserts exact subset-priced ledger rows, the cached
    # sum on gateway_usage_timeseries, and the interim engine's caching /
    # compression / cheaper-model advice with checkable dollar math.
    image: ${EXPLABS_API_IMAGE:-explabs-local-api}
    build:
      context: ..
      dockerfile: docker/api/Dockerfile
    profiles: ["smoke"]
    depends_on:
      gateway-worker:
        condition: service_healthy
    environment:
      # Same engine image as api/gateway-worker, so the same telemetry-dark
      # knob applies (README "No phone home"); the engine default is enabled.
      EXP_TELEMETRY: "0"
      GATEWAY_WORKER_URL: http://gateway-worker:8080
      # Same loopback-provider addressing rules as gateway-worker-acceptance.
      SUPABASE_DB_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@supabase-db:5432/postgres
    volumes:
      - ./tests:/app/docker/tests:ro
    entrypoint:
      ["/app/.venv/bin/python", "/app/docker/tests/insights_suggestions_acceptance.py"]
    networks: [explabs]

# No fixed network name: compose derives "<project>_explabs" from
# --project-name (integration_stack.sh always sets a unique one). A fixed
# name override previously joined every stack whose EXPLABS_STACK_PROJECT_NAME
# was unset onto one shared network, where containers from different sessions
# resolved each other's supabase-db by DNS.
networks:
  explabs:

volumes:
  supabase-db-data:
  supabase-storage-data:
  pnpm-store:
